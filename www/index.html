<style>

.hero{position:relative;padding:170px 0 0;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:72px 72px;background-position:center top;
  mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000 30%,transparent 75%);
  opacity:.55;
}
.hero-glow{
  position:absolute;left:50%;top:-340px;width:1100px;height:760px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(229,57,53,.16),rgba(229,57,53,.04) 55%,transparent);
  filter:blur(10px);animation:breathe 8s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.85;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
.beams{position:absolute;left:50%;top:0;width:1400px;height:900px;transform:translateX(-50%);
  mask-image:linear-gradient(#000,transparent 80%);-webkit-mask-image:linear-gradient(#000,transparent 80%)}
.beam{position:absolute;top:-10%;width:1px;height:40%;background:linear-gradient(transparent,rgba(229,57,53,.35),transparent);
  animation:beam 7s linear infinite;opacity:0}
@keyframes beam{0%{transform:translateY(-40%);opacity:0}10%{opacity:1}70%{opacity:.6}100%{transform:translateY(120%);opacity:0}}
#embers{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.cursor-glow{position:fixed;left:0;top:0;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(229,57,53,.15) 0%,rgba(229,57,53,0) 70%);opacity:0;transition:opacity .4s;will-change:transform}
body.has-cursor .cursor-glow{opacity:1}
@media (hover:none){.cursor-glow{display:none}}

.hero-inner{text-align:center;position:relative}
.pill{
  display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;
  background:rgba(229,57,53,.08);border:1px solid rgba(229,57,53,.2);font-size:13px;font-weight:500;color:#ff8a80;
  transition:background .3s,border-color .3s;
}
.pill:hover{background:rgba(229,57,53,.12);border-color:rgba(229,57,53,.4)}
.pill .tag{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(229,57,53,.2);animation:pulse 2s infinite;font-size:0}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,57,53,0)}}
.pill svg{width:14px;height:14px;opacity:.7}
.h1{
  font-size:clamp(44px,8.4vw,104px);line-height:1;letter-spacing:-.045em;font-weight:900;
  margin:28px auto 0;max-width:1000px;
}
.h1 .line{display:block;overflow:hidden;padding-bottom:.06em}
.h1 .line>span{display:inline-block;transform:translateY(105%);animation:rise 1.1s var(--ease) forwards}
.h1 .line:nth-child(2)>span{animation-delay:.12s}
@keyframes rise{to{transform:none}}
.hero .lead{margin:28px auto 0;max-width:640px}
.rotator{display:inline-grid;vertical-align:bottom;color:var(--text);font-weight:500;overflow:hidden;height:1.6em;text-align:left}
.rotator span{grid-area:1/1;justify-self:start;white-space:nowrap;transition:transform .7s var(--ease),opacity .7s var(--ease);transform:translateY(110%);opacity:0}
.rotator span.on{transform:none;opacity:1}
.rotator span.out{transform:translateY(-110%);opacity:0}
.rotator span::after{content:"";}
.hero-ctas{display:flex;gap:12px;justify-content:center;margin-top:40px;flex-wrap:wrap}
.hero-free{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--muted)}
.hero-free svg{width:16px;height:16px}
.hero-free b{color:var(--text);font-weight:600}
.hero-trust{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:28px;font-size:13px;color:var(--dim)}
.hero-trust span{display:inline-flex;align-items:center;gap:7px}
.hero-trust svg{width:15px;height:15px;color:var(--red-3)}
.fade-up{opacity:0;transform:translateY(16px);animation:fadeUp 1s var(--ease) forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}

.stage{position:relative;margin-top:84px;padding-bottom:40px}
.horizon{
  position:absolute;left:50%;top:120px;width:2400px;height:2400px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,#050505 97%,transparent);
  box-shadow:0 -1px 0 rgba(229,57,53,.55),0 -8px 30px rgba(229,57,53,.22),0 -60px 160px rgba(229,57,53,.14),inset 0 30px 80px -30px rgba(229,57,53,.18);
  z-index:-1;
}
.horizon::before{content:"";position:absolute;inset:-2px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 40%,rgba(255,82,82,.7) 50%,transparent 60% 100%);
  mask:radial-gradient(closest-side,transparent 99.6%,#000 99.8%);-webkit-mask:radial-gradient(closest-side,transparent 99.6%,#000 99.8%);
  animation:spin 14s linear infinite;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}

.app{
  position:relative;max-width:1040px;margin:0 auto;border-radius:20px;
  background:linear-gradient(180deg,rgba(22,22,24,.92),rgba(10,10,11,.96));
  border:1px solid var(--line-2);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 40px 120px -20px rgba(0,0,0,.9),0 0 80px -30px var(--glow),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;text-align:left;
  transform-style:preserve-3d;transition:transform .8s var(--ease);
}
.app::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(229,57,53,.14),transparent 30%);opacity:.6}
.app-bar{height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);position:relative}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;background:#2a2a2d}
.dots i:first-child{background:#ff5f57}
.app-url{flex:1;display:flex;justify-content:center}
.app-url span{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--surface);border:1px solid var(--line);padding:4px 14px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
.app-url svg{width:11px;height:11px}
.app-body{display:grid;grid-template-columns:230px 1fr;min-height:470px}
.side{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.25)}
.side-new{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);font-size:13px;font-weight:500;margin-bottom:12px}
.side-new svg{width:14px;height:14px;color:var(--red)}
.side-label{font-size:10.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding:8px 10px 4px}
.side-item{font-size:13px;color:var(--muted);padding:7px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-item.on{background:var(--surface-2);color:var(--text)}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:linear-gradient(135deg,rgba(229,57,53,.14),rgba(229,57,53,.03));border:1px solid rgba(229,57,53,.2)}
.side-foot .plan-row{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.side-foot .plan-row span:last-child{color:var(--red-3);font-family:var(--mono);font-weight:500}
.gems-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.gems-bar i{display:block;height:100%;width:72%;background:linear-gradient(90deg,var(--red-2),var(--red-3));border-radius:inherit}
.side-foot small{display:block;margin-top:8px;font-size:11px;color:var(--dim)}

.chat{display:flex;flex-direction:column;min-width:0}
.chat-top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.model-pick{display:inline-flex;align-items:center;gap:9px;padding:6px 12px 6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500}
.model-pick .plogo{width:22px;height:22px;border-radius:6px;transition:opacity .3s}
.model-pick svg{width:12px;height:12px;color:var(--dim)}
.model-name{display:inline-block;min-width:120px;transition:opacity .3s,transform .3s var(--ease)}
.model-name.swap{opacity:0;transform:translateY(-6px)}
.chat-flags{display:flex;gap:6px}
.flag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.flag.on{color:#ffc9c6;border-color:rgba(229,57,53,.35);background:rgba(229,57,53,.08)}
.msgs{flex:1;padding:24px 26px;display:flex;flex-direction:column;gap:18px;overflow:hidden;height:340px}
.msg-user{align-self:flex-end;max-width:78%;background:var(--surface-2);border:1px solid var(--line);padding:11px 16px;border-radius:16px 16px 4px 16px;font-size:14.5px;min-height:46px}
.msg-ai{display:flex;gap:12px;max-width:92%}
.msg-ai .av{width:28px;height:28px;flex:none;border-radius:8px;overflow:hidden;box-shadow:0 0 18px -4px var(--glow)}
.msg-ai .av img{width:100%;height:100%;display:block}
.msg-ai .txt{font-size:14.5px;color:#d9d9de;line-height:1.65;white-space:pre-wrap;padding-top:3px}
.msg-ai .txt code,.msg-ai .txt .code{font-family:var(--code);font-size:12.5px}
.msg-ai .txt .code{display:block;background:#0d0d0f;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;color:#ffb4b0;white-space:pre}
.msg-ai .txt .w{animation:wIn .55s ease-out both}
@keyframes wIn{from{opacity:0;filter:blur(3px)}}
.msg-user.pop{animation:popIn .35s var(--ease) both}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes blink{50%{opacity:0}}
.thinking{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--dim);font-family:var(--mono)}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--red);animation:bounce 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.composer{margin:0 18px 18px;border:1px solid var(--line-2);border-radius:16px;background:rgba(0,0,0,.35);padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px}
.composer .ph{flex:1;font-size:14px;color:var(--dim)}
.composer .attach{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line-2);transition:color .25s,border-color .25s}
.composer .attach:hover{color:var(--text);border-color:rgba(229,57,53,.4)}
.composer .attach svg{width:15px;height:15px}
.composer .send{width:34px;height:34px;border-radius:10px;background:var(--red);display:grid;place-items:center;box-shadow:0 0 20px -4px var(--glow)}
.composer .send svg{width:15px;height:15px;color:#fff}

.ht-rate{display:inline-flex;align-items:center;gap:8px;color:var(--muted);transition:color .25s}
.ht-rate:hover{color:var(--text)}
.ht-rate b{color:var(--text);font-weight:600}
.hero-trust .ht-stars{display:inline-flex;gap:2px}
.hero-trust .ht-rate>span:not(.ht-stars),.hero-trust .ht-rate>span:not(.ht-stars) span{display:inline}
.ht-stars i{width:12px;height:12px;background:#ffc15e;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

.menu-open .m-cta,.menu-open .dc-bubble,.menu-open .dc{opacity:0 !important;visibility:hidden}

.float-chip{
  position:absolute;z-index:3;display:flex;white-space:nowrap;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;
  background:rgba(18,18,20,.85);border:1px solid var(--line-2);backdrop-filter:blur(14px);font-size:13px;
  box-shadow:0 20px 50px -15px rgba(0,0,0,.9);animation:floaty 6s ease-in-out infinite;
}
.float-chip .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(229,57,53,.12);color:var(--red-3)}
.float-chip .ic svg{width:15px;height:15px}
.float-chip b{display:block;font-weight:600;font-size:13px}
.float-chip small{color:var(--dim);font-size:11.5px}
.chip-a{left:min(calc(50% + 190px),calc(100% - 270px));bottom:-8px}
.chip-b{left:min(calc(50% + 470px),calc(100% - 270px));top:-30px;animation-delay:-2s}
.chip-c{right:calc(50% + 500px);top:340px;animation-delay:-4s}
@media (max-width:1460px){.chip-c{display:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (max-width:1240px){.float-chip{display:none}}
@media (max-width:820px){
  .app-body{grid-template-columns:1fr}
  .side{display:none}
  .msgs{padding:18px 16px;height:360px}
  .chat-flags .flag:not(.on){display:none}
}
@media (max-width:640px){
  .hero{padding-top:130px}
  .stage{margin-top:56px}
  .horizon{top:80px}
  .app-url{display:none}
  .msg-user,.msg-ai .txt{font-size:13.5px}
  .composer{margin:0 12px 12px}
  .composer .attach{display:none}
}

.stats{display:grid;grid-template-columns:repeat(4,1fr);max-width:1040px;margin:70px auto 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:30px 20px;text-align:center;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:24%;height:52%;width:1px;background:var(--line)}
.stat b{display:block;font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.04em;line-height:1}
.stat b sup{font-size:.5em;color:var(--red);vertical-align:.6em;margin-left:2px}
.stat>span{display:block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3)::before{display:none}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.logos{padding:70px 0 20px;position:relative}
.logos p{text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.marquee{display:flex;overflow:hidden;margin-top:30px;
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marquee-track{display:flex;gap:64px;padding-right:64px;flex:none;animation:marquee 38s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-100%)}}
.brand{display:inline-flex;align-items:center;gap:12px;font-size:22px;font-weight:700;letter-spacing:-.025em;color:#8b8b93;white-space:nowrap;transition:color .3s}
.brand:hover{color:var(--text)}
.brand .plogo{width:34px;height:34px;border-radius:10px}


.models-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
#modeles .mgrid{margin-top:56px}
.tools-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px}
.tools-head h3{font-size:20px;font-weight:700;letter-spacing:-.025em}
.tools-head p{font-size:14px;color:var(--dim)}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.tool{border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(229,57,53,.06),rgba(255,255,255,.01));padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .4s var(--ease)}
.tool:hover{transform:translateY(-3px)}
.tool-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tool-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;position:relative;color:#ff8a80;
  background:radial-gradient(circle at 30% 15%,rgba(255,120,110,.32),rgba(229,57,53,.07) 65%),#120a0b;border:1px solid rgba(229,57,53,.32);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 26px -12px var(--glow);transition:transform .5s var(--ease),box-shadow .5s,color .5s}
.tool-ic svg{width:22px;height:22px;overflow:visible}
.tool-ic .du{fill:currentColor;opacity:.18;stroke:none}
.tool-ic .fc{fill:currentColor;stroke:none}
.tool:hover .tool-ic{transform:rotate(-6deg) scale(1.07);color:#ffb4ab;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px -8px var(--glow)}
.tool.is-gold .tool-ic{color:#f5c870;background:radial-gradient(circle at 30% 15%,rgba(245,200,112,.3),rgba(245,200,112,.05) 65%),#110e08;border-color:rgba(245,200,112,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.1
